buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.3.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.devtools.ksp:symbol-processing-gradle-plugin:2.1.0-1.0.29")
    }
}

apply plugin: "com.facebook.react.rootproject"

subprojects {
    configurations.all {
        resolutionStrategy {
            force "com.google.devtools.ksp:symbol-processing-api:2.1.0-1.0.29"
            force "com.google.devtools.ksp:symbol-processing:2.1.0-1.0.29"
        }
        // Exclude the old support library entirely — AndroidX replaces it
        exclude group: "com.android.support"
    }
}